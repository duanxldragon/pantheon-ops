apiVersion: v1
kind: Service
metadata:
  name: pantheon-backend
  namespace: pantheon
  labels:
    app: pantheon-backend
    component: backend
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: pantheon-backend
