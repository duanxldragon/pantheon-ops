name: Base Compatibility Rebuild

on:
  schedule:
    - cron: '57 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild Ops on current Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pantheon-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pantheon-ops
          persist-credentials: false

      - name: Checkout pantheon-base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/pantheon-base
          path: pantheon-base
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test rebuild contract
        working-directory: pantheon-ops
        run: npm run test:business-overlay

      - name: Rebuild clean consumer
        working-directory: pantheon-ops
        run: npm run rebuild:from-base -- --base ../pantheon-base --target .tmp/base-compatibility

      - name: Check rebuilt overlay
        working-directory: pantheon-ops
        run: node scripts/business-overlay/check-business-overlay.mjs --root .tmp/base-compatibility

      - name: Compile rebuilt backend
        working-directory: pantheon-ops/.tmp/base-compatibility/backend
        run: go test ./modules/business/... ./modules/system/iam/menu/...

      - name: Type-check rebuilt frontend
        working-directory: pantheon-ops/.tmp/base-compatibility/frontend
        run: npm ci --ignore-scripts && npm run type-check
