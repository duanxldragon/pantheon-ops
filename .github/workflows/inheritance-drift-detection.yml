name: Base Compatibility Rebuild

on:
  schedule:
    - cron: '57 8 * * 1'
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild Ops on latest official Base release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pantheon-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pantheon-ops
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test rebuild contract
        working-directory: pantheon-ops
        run: npm run test:business-overlay

      - name: Fetch and lock latest stable Base release from GitHub
        working-directory: pantheon-ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch:base-release

      - name: Rebuild clean consumer from verified GitHub release
        working-directory: pantheon-ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run rebuild:from-base -- --target .tmp/base-compatibility

      - name: Check rebuilt shared files against locked GitHub snapshot
        working-directory: pantheon-ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:shared-drift -- --root .tmp/base-compatibility

      - name: Check rebuilt overlay
        working-directory: pantheon-ops
        run: node scripts/business-overlay/check-business-overlay.mjs --root .tmp/base-compatibility

      # The overlay merges Base's go.mod with the business modules' declared
      # dependencies, so the assembly only lists Base's indirect requirements.
      # Tidy recomputes them before anything can be built; this is the same step
      # a consumer runs locally after a rebuild.
      - name: Finalize rebuilt module graph
        working-directory: pantheon-ops/.tmp/base-compatibility/backend
        run: go mod tidy

      - name: Compile rebuilt backend
        working-directory: pantheon-ops/.tmp/base-compatibility/backend
        run: go test ./modules/business/... ./modules/system/iam/menu/...

      - name: Type-check rebuilt frontend
        working-directory: pantheon-ops/.tmp/base-compatibility/frontend
        run: npm ci --ignore-scripts && npm run type-check
