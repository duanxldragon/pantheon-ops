# SonarCloud automatic-analysis scope control.
#
# These exclusions align this foundation-release consumer with pantheon-base:
# - tooling is covered by repository-local tests and CI gates;
# - DDL, seed, and migration SQL trigger application-code-only rules; and
# - i18n resource maps produce password-label false positives under S2068.
#
# Business modules, shared product code, tests, Dockerfile, and GitHub Actions
# remain in SonarCloud's analysis scope.
sonar.exclusions=scripts/**,frontend/scripts/**,database/**,**/*.sql,frontend/src/i18n/resources/**
