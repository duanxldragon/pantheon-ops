# SonarCloud CI-based analysis configuration for pantheon-ops.
#
# Mirrors the exclusion rationale in .sonarcloud.properties / pantheon-base:
# - scripts/**, frontend/scripts/**: repository tooling, guarded by its own
#   tests and CI gates, not shipped product code.
# - database/**, **/*.sql: DDL/seed/migration files; SQL rules are
#   application-code rules and only produce noise on seed data.
# - frontend/src/i18n/resources/**: translation resource maps; every finding
#   there is a typescript:S2068 hardcoded-credential false positive on
#   translation strings for password-related UI labels.
#
# Product code (backend/**, frontend/src/** minus i18n resources), tests,
# Dockerfile, and .github/workflows remain fully analyzed.

sonar.projectKey=duanxldragon_pantheon-ops
sonar.organization=duanxldragon

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=scripts/**,frontend/scripts/**,database/**,**/*.sql,frontend/src/i18n/resources/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**
