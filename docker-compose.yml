services:
  mysql:
    image: mysql:8.0
    container_name: pantheon-mysql
    restart: unless-stopped
    environment:
      # 凭据只从环境读取：复制 .env.example 为 .env 并设置强口令。
      # 未设置时 compose 直接失败，不提供默认口令。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - copy .env.example to .env and set a strong password}
      MYSQL_DATABASE: pantheon_ops
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      # 建库只走应用启动时的 migrate + runtime seed；不再挂载 database/system_init.sql
      # （旧 16 表 DDL 已废弃，挂载会建出落后于迁移的残缺 schema）。
      - pantheon_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: pantheon-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required - copy .env.example to .env and set a strong password}
    ports:
      - "6379:6379"
    volumes:
      - pantheon_redis_data:/data

volumes:
  pantheon_mysql_data:
  pantheon_redis_data:
