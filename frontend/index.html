<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pantheon platform</title>
    <script>
      // Pre-paint color mode: set the root attribute before first paint so the
      // page background never flashes light-on-dark. Body's arco-theme is set
      // by colorMode.ts before React renders.
      (() => {
        let mode = null;
        try {
          mode = localStorage.getItem('pantheon_color_mode');
        } catch (error) {
          // Storage can be unavailable (privacy mode); fall through to the
          // media-query default below.
          mode = null;
        }
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.colorMode = mode;
      })();
    </script>
    <script>
      (() => {
        const resizeObserverNoise = 'ResizeObserver loop completed with undelivered notifications.';
        const isKnownNoise = (value) => {
          if (value instanceof ErrorEvent) {
            return value.message === resizeObserverNoise;
          }
          if (value instanceof PromiseRejectionEvent) {
            return (
              value.reason?.message === resizeObserverNoise || value.reason === resizeObserverNoise
            );
          }
          return false;
        };

        window.addEventListener(
          'error',
          (event) => {
            if (!isKnownNoise(event)) {
              return;
            }
            event.preventDefault();
            event.stopImmediatePropagation();
          },
          true,
        );

        window.addEventListener(
          'unhandledrejection',
          (event) => {
            if (!isKnownNoise(event)) {
              return;
            }
            event.preventDefault();
            event.stopImmediatePropagation();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
